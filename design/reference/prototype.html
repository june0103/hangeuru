  --shadow-xlarge:0px 10px 15px -5px rgba(23,23,23,.1),0px 24px 38px -10px rgba(23,23,23,.12);
  /* 주간 달성: violet / 나무: Montage atomic green, orange */
  --done:#6541F2;
  --leaf:#00BF40;
  --leaf2:#009632;
  --trunk:#9C5800;
  --soil:#663A00;
  --seed:#D47800;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;height:100%;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
@media (max-width:767px){html{scroll-padding-top:calc(116px + env(safe-area-inset-top,0px))}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  margin:0;min-height:100%;
  background:var(--bg-secondary);color:var(--fg-primary);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Helvetica Neue","Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol",sans-serif;
  font-size:1rem;line-height:1.5rem;letter-spacing:.0057em;
  word-break:keep-all;overflow-wrap:anywhere;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-secondary)}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--fg-brand);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{flex-shrink:0;display:block}
.tnum{font-feature-settings:"tnum" 1}

/* typography (Montage variants) */
.t-title3{font-size:1.5rem;line-height:2rem;letter-spacing:-.023em;font-weight:700}
.t-heading1{font-size:1.375rem;line-height:1.875rem;letter-spacing:-.0194em;font-weight:600}
.t-heading2{font-size:1.25rem;line-height:1.75rem;letter-spacing:-.012em;font-weight:600}
.t-headline1{font-size:1.125rem;line-height:1.625rem;letter-spacing:-.002em;font-weight:600}
.t-headline2{font-size:1.0625rem;line-height:1.5rem;letter-spacing:0;font-weight:600}
.t-body1{font-size:1rem;line-height:1.5rem;letter-spacing:.0057em}
.t-body2{font-size:.9375rem;line-height:1.375rem;letter-spacing:.0096em}
.t-label1{font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em}
.t-label1r{font-size:.875rem;line-height:1.375rem;letter-spacing:.0145em}
.t-label2{font-size:.8125rem;line-height:1.125rem;letter-spacing:.0194em}
.t-caption1{font-size:.75rem;line-height:1rem;letter-spacing:.0252em}
.w-regular{font-weight:400}.w-medium{font-weight:500}.w-bold{font-weight:600}
.c-secondary{color:var(--fg-secondary)}.c-tertiary{color:var(--fg-tertiary)}

/* layout: containerStyle() */
.container{width:100%;margin:0 auto;padding:0 20px}
@media (min-width:768px){.container{width:90%;max-width:1060px;padding:0}}

/* ---------- Button ---------- */
.m-btn{
  display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  white-space:nowrap;position:relative;border:0;margin:0;width:fit-content;height:fit-content;
  font-weight:600;overflow:hidden;
}
.m-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--fg-primary);opacity:0;transition:opacity .15s ease;pointer-events:none}
@media (pointer:fine){.m-btn:hover::after{opacity:.05}}
.m-btn:active::after{opacity:.12}
.m-btn--lg{border-radius:14px;min-height:48px;padding:13px 20px;gap:6px;font-size:.9375rem;line-height:1.375rem;letter-spacing:.0096em}
.m-btn--md{border-radius:12px;min-height:40px;padding:10px 16px;gap:4px;font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em}
.m-btn--sm{border-radius:10px;min-height:32px;padding:8px 12px;gap:4px;font-size:.75rem;line-height:1rem;letter-spacing:.0252em}
.m-btn--solid-primary{color:#fff;background:var(--surface-brand)}
.m-btn--solid-assistive{color:var(--fg-secondary);background:var(--surface-secondary)}
.m-btn--outlined-assistive{color:var(--fg-primary);background:transparent;box-shadow:inset 0 0 0 1px var(--line-secondary)}
.m-btn--outlined-primary{color:var(--fg-brand);background:transparent;box-shadow:inset 0 0 0 1px var(--line-secondary)}
.m-btn:disabled{color:var(--fg-disable);background:var(--surface-disable);box-shadow:none;pointer-events:none;cursor:initial}
.m-btn--full{width:100%}

/* TextButton */
.m-text-btn{display:inline-flex;align-items:center;gap:4px;background:transparent;border:0;padding:5px 0;font-weight:600;font-size:.9375rem;line-height:1.375rem;letter-spacing:.0096em;border-radius:6px}
.m-text-btn--sm{padding:4px 0;font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em}
.m-text-btn--primary{color:var(--fg-brand)}
.m-text-btn--assistive{color:var(--fg-secondary)}
@media (pointer:fine){.m-text-btn:hover{opacity:.74}}

/* IconButton (normal) */
.m-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9999px;border:0;background:transparent;color:var(--fg-primary);position:relative}
.m-icon-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--fg-primary);opacity:0;transition:opacity .15s ease}
@media (pointer:fine){.m-icon-btn:hover::after{opacity:.05}}
.m-icon-btn:active::after{opacity:.12}
.m-icon-btn:disabled{color:var(--fg-disable);pointer-events:none}

/* ---------- FormControl / TextField ---------- */
.m-form{display:flex;flex-direction:column;gap:16px}
.m-control{display:flex;flex-direction:column;gap:8px}
.m-label{font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em;font-weight:600;color:var(--fg-secondary)}
.m-msg{font-size:.75rem;line-height:1rem;letter-spacing:.0252em;color:var(--fg-tertiary)}
.m-msg--negative{color:var(--fg-negative)}
.m-msg:empty{display:none}
.m-field{
  display:flex;align-items:center;background:var(--transparent-primary);
  box-shadow:inset 0 0 0 1px var(--line-secondary);transition:box-shadow .2s ease;
  border-radius:14px;padding:12px 8px;cursor:text;
  font-size:.9375rem;line-height:1.375rem;letter-spacing:.0096em;font-weight:400;
}
.m-field input{width:100%;min-width:0;background:transparent;border:0;outline:0;box-shadow:none;padding:1px 4px;color:var(--fg-primary);caret-color:var(--fg-brand)}
.m-field input::placeholder{color:var(--fg-tertiary)}
.m-field:has(input:focus){box-shadow:inset 0 0 0 1px var(--line-brand-strong),0 0 0 4px var(--line-brand-focus)}
.m-control.is-negative .m-field{box-shadow:inset 0 0 0 1px var(--line-negative)}
.m-control.is-negative .m-field:has(input:focus){box-shadow:inset 0 0 0 1px var(--line-negative-strong),0 0 0 4px var(--line-negative-focus)}

/* framedStyle({size:'large'}) + Radio */
.plan-group{display:flex;flex-direction:column;gap:8px}
.m-framed{position:relative;display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:16px;background:transparent;cursor:pointer}
.m-framed::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;transition:box-shadow .2s ease;box-shadow:var(--shadow-xsmall),inset 0 0 0 1px var(--line-secondary)}
.m-framed:has(input:checked)::before{box-shadow:var(--shadow-xsmall),inset 0 0 0 2px var(--line-brand-strong)}
.m-framed:has(input:focus-visible){outline:2px solid var(--fg-brand);outline-offset:2px}
.plan-text,.m-radio{position:relative}
.plan-text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.plan-name{font-size:1rem;line-height:1.5rem;font-weight:600}
.plan-desc{font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em;color:var(--fg-tertiary)}
.m-radio{width:20px;height:20px;border-radius:9999px;flex-shrink:0;background:var(--bg-primary);box-shadow:inset 0 0 0 1.5px var(--line-primary);display:flex;align-items:center;justify-content:center;color:transparent}
.m-framed:has(input:checked) .m-radio{background:var(--surface-brand);box-shadow:none;color:#fff}
.m-radio::after{content:"";width:8px;height:8px;border-radius:9999px;background:currentColor}

/* ---------- ContentBadge ---------- */
.m-badge{display:inline-flex;align-items:center;justify-content:center;width:fit-content;flex-shrink:0;white-space:nowrap;font-weight:500;border-radius:8px;padding:4px 6px;gap:4px;font-size:.75rem;line-height:1rem;letter-spacing:.0252em}
.m-badge--md{border-radius:10px;padding:5px 8px;font-size:.8125rem;line-height:1.125rem;letter-spacing:.0194em}
.m-badge--neutral{background:var(--surface-secondary);color:var(--fg-secondary)}
.m-badge--violet{background:var(--surface-violet);color:var(--fg-violet)}
.m-badge--lime{background:var(--surface-lime);color:var(--fg-lime)}
.m-badge--brand{background:var(--surface-brand-badge);color:var(--fg-brand)}
.m-badge--outlined{background:transparent;color:var(--fg-secondary);box-shadow:inset 0 0 0 1px var(--line-primary)}

/* ---------- SectionMessage ---------- */
.m-secmsg{display:flex;gap:8px;align-items:flex-start;width:100%;border-radius:12px;padding:12px;font-size:.9375rem;line-height:1.375rem;letter-spacing:.0096em;font-weight:500;color:var(--fg-primary)}
.m-secmsg .ic{margin-top:1px}
.m-secmsg--info{background:var(--surface-brand-subtle)}
.m-secmsg--info .ic{color:var(--fg-brand)}
.m-secmsg--positive{background:color-mix(in srgb,var(--fg-positive) 5%,transparent)}
.m-secmsg--positive .ic{color:var(--fg-positive)}
.m-secmsg-desc{display:block;font-size:.875rem;line-height:1.375rem;letter-spacing:.0145em;font-weight:400;color:var(--fg-secondary)}

/* ---------- Table ---------- */
.m-table{border-radius:12px;overflow:hidden;border:1px solid var(--line-secondary-opaque)}
.m-table-scroll{overflow-x:auto}
.m-table table{width:100%;border-collapse:separate;border-spacing:0}
.m-table thead{background:var(--surface-tertiary)}
.m-table th{padding:8px 0 8px 20px;height:44px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line-secondary-opaque);font-size:.8125rem;line-height:1.125rem;letter-spacing:.0194em;font-weight:600;color:var(--fg-secondary);white-space:nowrap}
.m-table td{padding:16px 0 16px 20px;height:44px;vertical-align:middle;border-bottom:1px solid var(--line-secondary-opaque);font-size:1rem;line-height:1.5rem;color:var(--fg-primary);white-space:nowrap}
.m-table th:last-child,.m-table td:last-child{padding-right:20px}
.m-table tbody tr:last-child td{border-bottom:0}

/* ---------- Toast ---------- */
.toast-region{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:1400;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 20px;pointer-events:none}
.m-toast{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:12px;background:var(--toast-bg);-webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px);color:#fff;font-size:.9375rem;line-height:1.375rem;letter-spacing:.0096em;font-weight:600;width:100%;animation:toast-in .2s ease}
.m-toast span{padding:5px 2px;opacity:.88}
.m-toast .ic{color:var(--fg-positive);background:radial-gradient(circle,#fff 0 38%,transparent 40%)}
.m-toast.is-out{opacity:0;transition:opacity .2s ease}
@media (min-width:768px){.m-toast{width:auto;min-width:356px;max-width:420px}}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Alert / Modal ---------- */
.overlay{position:fixed;inset:0;z-index:1300;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay-dim{position:absolute;inset:0;background:var(--dimmer)}
.m-alert{position:relative;background:var(--surface-elevated);border-radius:12px;width:100%;min-width:0;max-width:400px;display:flex;flex-direction:column;box-shadow:var(--shadow-xlarge)}
.m-alert-content{padding:20px;display:flex;flex-direction:column;gap:6px}
.m-alert-body{font-size:.9375rem;line-height:1.375rem;letter-spacing:.0096em;color:var(--fg-tertiary)}
.m-alert-actions{padding:0 20px 12px;display:flex;justify-content:flex-end;gap:24px}
.m-modal{position:relative;background:var(--surface-elevated);border-radius:24px;width:480px;max-width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-xlarge)}
.m-modal-nav{display:flex;align-items:center;justify-content:space-between;padding:24px 24px 16px}
.m-modal-content{padding:0 24px 8px;overflow-y:auto}
.m-modal-actions{display:flex;gap:8px;padding:16px 24px 24px}
.m-modal-actions .m-btn{flex:1}
@media (max-width:767px){
  .overlay--modal{padding:0;align-items:flex-end}
  .m-modal{width:100%;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}

/* ---------- demo bar (예시 전용) ---------- */
.demo-bar{background:var(--surface-brand-subtle);border-bottom:1px solid var(--line-tertiary)}
.demo-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-top:10px;padding-bottom:10px}
.demo-in p{font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em;color:var(--fg-secondary)}
.demo-in p b{color:var(--fg-primary);font-weight:600}
.demo-ctl{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- header ---------- */
.gnb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg-primary) 88%,transparent);-webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px);border-bottom:1px solid var(--line-tertiary)}
.gnb-in{display:flex;align-items:center;gap:32px;min-height:56px}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:1.0625rem;line-height:1.5rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;border-radius:6px}
.gnb-user{margin-left:auto;display:flex;align-items:center;gap:12px}
.m-tablist{display:flex;gap:24px;align-self:flex-end}
.m-tab{position:relative;padding:9px 0;white-space:nowrap;font-size:.9375rem;line-height:1.375rem;letter-spacing:.0096em;font-weight:600;color:var(--fg-quaternary);transition:color .2s ease;border-radius:4px}
@media (pointer:fine){.m-tab:hover{color:var(--fg-tertiary)}}
.m-tab[aria-current="page"]{color:var(--fg-strong)}
.m-tab[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:2px;background:var(--fg-strong)}
.gnb-in .m-tablist{padding-bottom:8px}
@media (max-width:767px){
  .gnb-in{gap:12px}
  .gnb .m-tablist{display:none}
}

/* ---------- 모바일 하단 탭과 출근 버튼 ---------- */
.bnav,.action-bar{display:none}
@media (max-width:767px){
  .bnav:not([hidden]){display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;height:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--surface-elevated) 88%,transparent);-webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px);border-top:1px solid var(--line-tertiary)}
  .bnav a{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;color:var(--fg-inactive);font-size:.6875rem;line-height:.875rem;letter-spacing:.0311em;font-weight:500}
  .bnav a[aria-current="page"]{color:var(--fg-brand)}
  .action-bar:not([hidden]){display:block;position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:6;padding:16px 20px 12px;background:linear-gradient(to top,var(--bg-secondary) 72%,transparent)}
  .has-action .p-today #main-action{display:none}
  .has-bnav main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .has-action main{padding-bottom:calc(164px + env(safe-area-inset-bottom,0px))}
  .has-bnav .toast-region{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .has-action .toast-region{bottom:calc(148px + env(safe-area-inset-bottom,0px))}
}

/* ---------- page ---------- */
main{padding:24px 0 96px}
.panel{background:var(--bg-primary);border:1px solid var(--line-secondary);border-radius:20px;padding:24px}
@media (max-width:767px){main{padding-top:16px}.panel{padding:20px;border-radius:16px}.p-today .hint{margin-top:16px}}

/* home */
.home{display:flex;gap:24px;align-items:flex-start}
.home-col{display:flex;flex-direction:column;gap:24px;min-width:0}
.home-col--side{flex:0 0 340px}
.home-col--main{flex:1}
@media (max-width:991px){
  .home{flex-direction:column;align-items:stretch;gap:16px}
  .home-col{display:contents}
  .p-today{order:1}.p-tree{order:2}.p-week{order:3}.p-camp{order:4}
}
.today-meta{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--fg-tertiary);font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em}
.p-today .m-btn{margin-top:20px}
.hint{margin-top:10px;font-size:.8125rem;line-height:1.125rem;letter-spacing:.0194em;color:var(--fg-tertiary)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line-tertiary)}
.times dt{font-size:.8125rem;line-height:1.125rem;letter-spacing:.0194em;color:var(--fg-tertiary)}
.times dd{margin-top:4px;font-size:1.25rem;line-height:1.75rem;letter-spacing:-.012em;font-weight:600}
.times dd.is-empty{color:var(--fg-quaternary)}

.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.weekdots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:16px}
.weekdots li{display:flex;flex-direction:column;align-items:center;gap:6px}
.wd-name{font-size:.75rem;line-height:1rem;letter-spacing:.0252em;color:var(--fg-tertiary);font-weight:500}
.wd-dot{width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;background:var(--surface-tertiary);box-shadow:inset 0 0 0 1.5px var(--line-primary);color:var(--fg-quaternary);font-size:.75rem;font-weight:600}
.wd-num{font-size:.75rem;line-height:1rem;letter-spacing:.0252em;color:var(--fg-quaternary);font-feature-settings:"tnum" 1}
.is-done .wd-dot{background:var(--done);box-shadow:none;color:#fff}
.is-today .wd-dot{background:var(--surface-violet);box-shadow:inset 0 0 0 2px var(--line-violet);color:var(--fg-violet)}
.is-today .wd-name,.is-today .wd-num{color:var(--fg-primary);font-weight:600}
.is-rest .wd-dot{background:transparent;box-shadow:none}
.week-text{margin-top:16px;font-size:.875rem;line-height:1.375rem;letter-spacing:.0145em;color:var(--fg-secondary)}
.streak{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-tertiary);font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em;font-weight:600}
.streak .ic{color:var(--fg-cautionary)}

/* tree */
.head-group{display:flex;align-items:center;gap:8px}
.tree-title{margin-top:8px}
.tree-body{display:flex;align-items:flex-start;gap:24px;margin-top:12px}
.tree-fig{flex:0 0 240px;max-width:100%}
.tree-fig svg{display:block;width:100%;height:auto}
.tree-side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding-top:28px}
.tree-side p{font-size:.9375rem;line-height:1.5rem;letter-spacing:.0096em;color:var(--fg-secondary)}
.tree-side p.c-tertiary{color:var(--fg-tertiary)}
@media (max-width:767px){
  .tree-body{flex-direction:column;align-items:center;gap:8px}
  .tree-fig{flex-basis:auto;width:220px}
  .tree-side{padding-top:0;width:100%}
}
.tr-soil{fill:var(--soil)}
.tr-seed{fill:var(--seed)}
.tr-stem{fill:none;stroke:var(--leaf2);stroke-linecap:round}
.tr-trunk{fill:none;stroke:var(--trunk);stroke-linecap:round}
.tr-leaf{fill:var(--leaf)}
.tr-leaf2{fill:var(--leaf2)}
.tr-basket{fill:var(--seed);stroke:var(--trunk);stroke-width:1.5;stroke-linejoin:round}
.tr-basket-h{fill:none;stroke:var(--trunk);stroke-width:2.5;stroke-linecap:round}
.fruit-btn{cursor:pointer;outline:none}
.fruit-hit{fill:transparent}
.fruit-ring{fill:none;stroke:var(--fg-brand);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:fruit-ring 1.6s ease-out infinite}
.fruit-btn:focus-visible .fruit-ring{animation:none;stroke-width:3}
@keyframes fruit-ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.pop-target{transform-box:fill-box;transform-origin:center}
.is-pop .pop-target{animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.is-pop .pop-target,.m-toast{animation:none}.fruit-ring{animation:none;opacity:.6}}

/* growth track */
.track{width:100%;padding:0 14px}
.track-bar{position:relative;height:8px;border-radius:9999px;background:var(--surface-strong)}
.track-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9999px;background:var(--leaf)}
.track-bar b{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:9999px;background:var(--bg-primary);box-shadow:inset 0 0 0 2px var(--line-primary)}
.track-bar b.is-on{background:var(--leaf2);box-shadow:none}
.track-steps{position:relative;height:38px;margin-top:8px}
.track-steps li{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;white-space:nowrap;color:var(--fg-tertiary)}
.track-steps span{font-size:.75rem;line-height:1rem;letter-spacing:.0252em;font-weight:500}
.track-steps em{font-style:normal;font-size:.6875rem;line-height:.875rem;letter-spacing:.0311em;color:var(--fg-quaternary);font-feature-settings:"tnum" 1}
.track-steps li.is-on{color:var(--fg-primary)}
.track-steps li.is-on span{font-weight:600}

/* seed picker */
.seed-group{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seed-opt{flex-direction:column;gap:4px;padding:12px 4px 10px;align-items:center}
.seed-opt svg{position:relative}
.seed-name{position:relative;font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em;font-weight:600}
.seed-opt:has(input:disabled){cursor:default;opacity:.43}
.seed-opt:has(input:disabled):has(input:checked){opacity:1}

/* harvest card */
.hv-img{display:block;width:100%;max-width:360px;height:auto;margin:0 auto;border-radius:16px;-webkit-touch-callout:default;user-select:auto}
.hv-help{margin:12px 0 4px;text-align:center;font-size:.875rem;line-height:1.375rem;letter-spacing:.0145em;color:var(--fg-secondary)}
.m-toast--info .ic{color:#fff;background:none}

/* camp today */
.camp-text{margin-top:8px;font-size:.9375rem;line-height:1.375rem;letter-spacing:.0096em;color:var(--fg-secondary)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip-dot{width:6px;height:6px;border-radius:9999px;background:var(--fg-lime)}
.p-camp .m-text-btn{margin-top:12px}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-nav .t-headline2{min-width:7.5em;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:20px}
.cal-wd{text-align:center;font-size:.8125rem;line-height:1.125rem;letter-spacing:.0194em;font-weight:500;color:var(--fg-tertiary);padding:4px 0}
.cal-cell{min-height:88px;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 0 1px var(--line-secondary);min-width:0}
.cal-cell.is-blank{box-shadow:none}
.cal-cell.is-off{background:var(--surface-tertiary);box-shadow:none}
.cal-cell.is-off .cal-num{color:var(--fg-quaternary)}
.cal-cell.is-today{box-shadow:inset 0 0 0 2px var(--line-brand-strong)}
.cal-num{font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em;font-weight:500;font-feature-settings:"tnum" 1}
.cal-mark{width:14px;height:14px;border-radius:9999px;background:var(--leaf);flex-shrink:0}
.cal-time{font-size:.75rem;line-height:1rem;letter-spacing:.0252em;color:var(--fg-secondary);font-feature-settings:"tnum" 1}
.cal-note{font-size:.75rem;line-height:1rem;letter-spacing:.0252em;color:var(--fg-tertiary)}
.cal-table{margin-top:24px}
.empty{padding:32px 20px;text-align:center;color:var(--fg-tertiary);font-size:.9375rem;line-height:1.375rem}
@media (max-width:767px){
  .cal-grid{gap:4px}
  .cal-cell{min-height:56px;padding:6px 4px;align-items:center;border-radius:10px}
  .cal-time,.cal-note{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
}

/* garden */
.lead{margin-top:8px;font-size:1rem;line-height:1.625rem;color:var(--fg-secondary);max-width:38em}
.garden{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
@media (max-width:991px){.garden{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:599px){.garden{grid-template-columns:1fr}}
.member{display:flex;gap:16px;align-items:flex-start;padding:20px}
.member-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.member-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.member-badges{display:flex;flex-wrap:wrap;gap:4px}
.member-count{font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em;color:var(--fg-secondary)}
.member-streak{display:flex;align-items:center;gap:4px;font-size:.8125rem;line-height:1.125rem;letter-spacing:.0194em;color:var(--fg-tertiary)}
.member-streak .ic{color:var(--fg-cautionary)}
.member-fig{flex:0 0 72px;display:flex;justify-content:center}
.member-fig svg{display:block}

/* auth */
.auth{max-width:420px;margin:24px auto 0}
.auth .lead{margin-bottom:24px}
.auth .m-secmsg{margin-bottom:20px}
.auth-foot{margin-top:20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.auth-foot p{font-size:.875rem;line-height:1.25rem;letter-spacing:.0145em;color:var(--fg-tertiary)}
.auth-foot a{color:var(--fg-brand);font-weight:600}

</style>
</head>

const WD = ['일', '월', '화', '수', '목', '금', '토'];
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fmt = dt => dt.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = toDate(s); d.setUTCDate(d.getUTCDate() + n); return fmt(d); };
const dow = s => toDate(s).getUTCDay();
const weekStart = s => addDays(s, -((dow(s) + 6) % 7));
const inSeason = s => s >= SEASON.open && s <= SEASON.end;
const isWorkday = s => inSeason(s) && dow(s) >= 1 && dow(s) <= 5 && !HOLIDAYS[s];
const koDate = s => `${+s.slice(5, 7)}월 ${+s.slice(8, 10)}일 ${WD[dow(s)]}요일`;
const koDay = s => `${+s.slice(5, 7)}월 ${+s.slice(8, 10)}일`;
const pad = n => String(n).padStart(2, '0');
const hm = min => pad(Math.floor(min / 60)) + ':' + pad(min % 60);
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

const SEASON_WEEKS = (() => { const out = []; for (let w = weekStart(SEASON.start); w <= SEASON.end; w = addDays(w, 7)) out.push(w); return out; })();
const OPEN_WEEKS = (() => { const out = []; for (let w = weekStart(SEASON.open); w < weekStart(SEASON.start); w = addDays(w, 7)) out.push(w); return out; })();
const ALL_WORKDAYS = (() => { const out = []; for (let d = SEASON.open; d <= SEASON.end; d = addDays(d, 1)) if (isWorkday(d)) out.push(d); return out; })();
const workdaysOfWeek = (w, from) => { const out = []; for (let i = 0; i < 5; i++) { const d = addDays(w, i); if (isWorkday(d) && d >= from) out.push(d); } return out; };
const nextWorkday = s => { for (let d = addDays(s, 1); d <= SEASON.end; d = addDays(d, 1)) if (isWorkday(d)) return d; return null; };
const workdaysLeft = (today, hasToday) => ALL_WORKDAYS.filter(d => d > today || (d === today && !hasToday)).length;

/* ================= 규칙 계산 ================= */
function memberStart(m) { return m.joinDate > SEASON.start ? m.joinDate : SEASON.start; }

function computeStats(m, recs, today) {
  const start = memberStart(m);
  const goal = PLANS[m.plan].goal;
  const asOf = today > SEASON.end ? SEASON.end : today;
  const dates = Object.keys(recs).filter(d => d <= today && isWorkday(d)).sort();
  const weeks = SEASON_WEEKS.filter(w => addDays(w, 6) >= start).map(w => {
    const days = workdaysOfWeek(w, start);
    const g = Math.min(goal, days.length);
    const count = dates.filter(d => d >= w && d <= addDays(w, 6)).length;
    return { w, days, goal: g, count, done: g > 0 && count >= g };
  });
  const cw = weekStart(asOf);
  const cur = weeks.find(x => x.w === cw) || null;
  let streak = 0;
  for (let i = weeks.length - 1; i >= 0; i--) {
    const x = weeks[i];
    if (x.w > cw || x.goal === 0) continue;
    if (x.w === cw && !x.done && today <= SEASON.end) continue;
    if (x.done) streak++; else break;
  }
  return { start, dates, days: dates.length, weeks, cur, streak };
}

function growth(days) {
  let i = 0;
  STAGES.forEach((s, k) => { if (days >= s.from) i = k; });
  return { index: i, cur: STAGES[i], next: STAGES[i + 1] || null };
}

function stay(r) {
  if (!r.in || !r.out) return '–';
  const [a, b] = r.in.split(':').map(Number), [c, d] = r.out.split(':').map(Number);
  const m = (c * 60 + d) - (a * 60 + b);
  if (m <= 0) return '–';
  const h = Math.floor(m / 60), mm = m % 60;
  return (h ? h + '시간 ' : '') + mm + '분';
}

function hash(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; }
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const demoCache = {};
function demoWeek(m, w) {
  const key = m.id + '|' + w;
  if (demoCache[key]) return demoCache[key];
  const rng = mulberry32(hash(key));
  const pre = w < weekStart(SEASON.start);
  const days = workdaysOfWeek(w, pre ? SEASON.open : SEASON.start);
  let k = pre ? (m.early ? 1 + Math.floor(rng() * days.length) : 0)
    : PLANS[m.plan].goal + (rng() < m.extra ? 1 : 0) - (rng() < m.miss ? 1 : 0);
  k = Math.max(0, Math.min(days.length, k));
  const order = days.map(d => [rng(), d]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  const out = {};
  order.slice(0, k).forEach(d => {
    const i = 560 + Math.floor(rng() * 70);
    const o = rng() < .12 ? null : 1060 + Math.floor(rng() * 110);
    out[d] = { in: hm(i), out: o == null ? null : hm(o) };
  });
  return (demoCache[key] = out);
}

  const today = store.demoDate, clock = nowHM();

    [...OPEN_WEEKS, ...SEASON_WEEKS].forEach(w => { if (w <= today) Object.assign(recs, demoWeek(m, w)); });
    Object.keys(recs).forEach(d => {
      if (d > today) delete recs[d];
      else if (d === today) {

        if (r.in > clock) delete recs[d];
        else if (r.out && r.out > clock) recs[d] = { in: r.in, out: null };

  const mini = !!o.mini, n = Math.min(days, FRUIT_DAYS);
  const W = 240, VH = 260, GX = 120, GY = 232;
  const H = n === 0 ? 0 : 16 + n * 5.2, topY = n1(GY - H), cy = n1(topY - 4);
  const pop = (isNew, inner) => `<g class="${isNew && o.pop ? 'is-pop' : ''}"><g class="pop-target">${inner}</g></g>`;
  let s = `<ellipse class="tr-soil" cx="${GX}" cy="${GY + 4}" rx="72" ry="12"/>`;
  if (n === 0) {
    s += `<ellipse class="tr-seed" cx="${GX}" cy="${GY - 6}" rx="9" ry="6.5" transform="rotate(-20 ${GX} ${GY - 6})"/><path class="tr-soil" d="M${GX - 20} ${GY + 3}Q${GX} ${GY - 5} ${GX + 20} ${GY + 3}Z"/>`;
  } else {
    s += `<path class="${n < 5 ? 'tr-stem' : 'tr-trunk'}" d="M${GX} ${GY}V${topY}" stroke-width="${n1(3 + n * .55)}"/>`;
    if (n < 10) {
      const rx = 10 + n * .6, ry = rx * .5;
      for (let i = n; i >= 1; i--) {
        const side = i % 2 ? 1 : -1, y = GY - H * (1 - Math.floor((i - 1) / 2) * .2) - 3, x = GX + side * rx * .9;
        s += pop(i === n, `<ellipse class="${i % 3 ? 'tr-leaf' : 'tr-leaf2'}" cx="${n1(x)}" cy="${n1(y)}" rx="${n1(rx)}" ry="${n1(ry)}" transform="rotate(${-28 * side} ${n1(x)} ${n1(y)})"/>`);
      }
    } else {
      const k = n - 7;
      BLOBS.slice(0, k).forEach(([dx, dy, r], i) => { s += pop(i === k - 1 && n < 15, `<circle class="${i % 2 ? 'tr-leaf2' : 'tr-leaf'}" cx="${GX + dx}" cy="${n1(cy + dy)}" r="${r}"/>`); });
      if (n >= 15 && n < FRUIT_DAYS) {
        FLOWERS.slice(0, n - 14).forEach(([dx, dy], i) => {
          let f = '';
          for (let p = 0; p < 5; p++) { const a = p * 72 * Math.PI / 180; f += `<circle cx="${n1(GX + dx + Math.sin(a) * 4.2)}" cy="${n1(cy + dy - Math.cos(a) * 4.2)}" r="3.2" fill="${BLOSSOM[seed]}"/>`; }
          s += pop(i === n - 15, f + `<circle cx="${GX + dx}" cy="${n1(cy + dy)}" r="2.2" fill="#FFC06E"/>`);
        });
      }
      if (n >= FRUIT_DAYS && !o.harvested) {
        const fx = GX + 30, fy = n1(cy + 28), fr = shapesSVG(fruitShapes(seed, 18));
        s += mini ? `<g transform="translate(${fx} ${fy})">${fr}</g>`
          : `<g transform="translate(${fx} ${fy})" class="fruit-btn" role="button" tabindex="0" data-action="harvest" aria-label="${SEEDS[seed].fruit} 수확하기"><circle class="fruit-ring" r="28"/><circle class="fruit-hit" r="32"/>${pop(true, fr)}</g>`;
      }
    }
  }
  if (o.harvested) {
    const bx = GX + 52, by = GY - 4;
    s += pop(true, `<g transform="translate(${bx} ${by})"><path class="tr-basket-h" d="M-13 -8Q0 -32 13 -8"/><g transform="translate(0 -11)">${shapesSVG(fruitShapes(seed, 9))}</g><path class="tr-basket" d="M-17 -8H17L13 10H-13Z"/></g>`);
  }
  const scale = mini ? .3 : 1;
  return `<svg${mini ? ' class="mini"' : ''} width="${W * scale}" height="${VH * scale}" viewBox="0 0 ${W} ${VH}" role="img" aria-label="${esc(o.label || '')}">${s}</svg>`;
}

function weekPanel(me, st, recs, today, over) {
  const pre = today < SEASON.start;
  const cur = st.cur || (pre ? { w: weekStart(today), days: workdaysOfWeek(weekStart(today), SEASON.open), goal: 0, count: 0, done: false } : null);
  if (!cur) return '';
  const dots = [];
  for (let i = 0; i < 5; i++) {
    const d = addDays(cur.w, i);
    const usable = cur.days.includes(d);
    let cls = '', inner = '', say = '';
    if (recs[d]) { cls = 'is-done'; inner = icon('check-thick', 18); say = '출근함'; }
    else if (!usable) { cls = 'is-rest'; inner = '–'; say = HOLIDAYS[d] || '출근일 아님'; }
    else if (d === today && !over) { cls = 'is-today'; inner = '오늘'; say = '오늘, 아직 출근 전'; }
    else { inner = ''; say = d < today ? '출근 안 함' : '아직 오지 않은 날'; }
    dots.push(`<li class="${cls}" aria-label="${WD[dow(d)]}요일 ${+d.slice(8, 10)}일, ${say}"><span class="wd-name" aria-hidden="true">${WD[dow(d)]}</span><span class="wd-dot" aria-hidden="true">${inner}</span><span class="wd-num" aria-hidden="true">${+d.slice(8, 10)}</span></li>`);
  }
  const left = cur.days.filter(d => d > today || (d === today && !recs[d])).length;
  const need = cur.goal - cur.count;
  let text;
  if (pre) text = `정식 시작은 ${koDate(SEASON.start)}이에요. 주간 목표는 그때부터 세요.`;
  else if (over) text = cur.done ? `마지막 주 목표 ${cur.goal}일을 채웠어요.` : `마지막 주에는 ${cur.count}일 출근했어요.`;
  else if (cur.goal === 0) text = '이번 주에는 출근할 수 있는 날이 없어요.';
  else if (cur.count > cur.goal) text = `이번 주 ${cur.count}일 출근했어요. 목표 ${cur.goal}일을 넘겼어요.`;
  else if (cur.done) text = `이번 주 목표 ${cur.goal}일을 채웠어요.`;
  else if (need > left) text = '이번 주 목표는 놓쳤어요. 그래도 나온 날만큼 나무는 자라요.';
  else if (cur.count === 0) text = `이번 주 목표는 ${cur.goal}일이에요. 아직 출근한 날이 없어요.`;
  else text = `이번 주 ${cur.count}일 출근했어요. ${need}일 더 나오면 목표 ${cur.goal}일을 채워요.`;
  return `<section class="panel p-week" aria-labelledby="h-week">
    <div class="panel-head"><div class="head-group"><h2 class="t-headline2" id="h-week">${over ? '마지막 주' : '이번 주'}</h2>${badge(PLANS[me.plan].label)}</div>${cur.done ? badge('목표 달성', 'violet') : ''}</div>
    <ol class="weekdots">${dots.join('')}</ol>
    <p class="week-text">${text}</p>
    ${st.streak > 0 ? `<p class="streak">${icon('fire-fill', 18)}<span>${st.streak}주 연속으로 목표를 채웠어요</span></p>` : ''}
  </section>`;
}

const NEXT_TEXT = {
  sprout: () => '하루 나오면 새싹이 나요.',
  sapling: n => `${n}일 더 나오면 묘목으로 자라요.`,
  tree: n => `${n}일 더 나오면 나무가 돼요.`,
  flower: n => `${n}일 더 나오면 꽃이 펴요.`,
  fruit: n => `${n}일 더 나오면 열매가 열려요.`,
};
function trackHTML(days) {
  const n = Math.min(days, FRUIT_DAYS);
  return `<div class="track" role="img" aria-label="열매까지 ${FRUIT_DAYS}일 중 ${n}일">
    <div class="track-bar"><i style="width:${n / FRUIT_DAYS * 100}%"></i>${STAGES.slice(1).map(s => `<b class="${days >= s.from ? 'is-on' : ''}" style="left:${s.from / FRUIT_DAYS * 100}%"></b>`).join('')}</div>
    <ol class="track-steps" aria-hidden="true">${STAGES.slice(1).map(s => `<li class="${days >= s.from ? 'is-on' : ''}" style="left:${s.from / FRUIT_DAYS * 100}%"><span>${s.label}</span><em>${s.from}일</em></li>`).join('')}</ol>
  </div>`;
}
function treePanel(me, st, rec, today, over) {
  const days = st.days, g = growth(days), harvested = !!harvestedAt(me, st);
  const canHarvest = days >= FRUIT_DAYS && !harvested;
  const left = over ? 0 : workdaysLeft(today, !!rec);
  let title;
  if (harvested) title = `${SEEDS[me.seed].fruit}${SEEDS[me.seed].obj} 수확했어요`;
  else if (canHarvest) title = '열매가 열렸어요';
  else if (days === 0) title = '씨앗을 심었어요';
  else title = `열매까지 ${FRUIT_DAYS - days}일 남았어요`;
  const svg = treeSVG(me.seed, days, { harvested, pop: ui.pop, label: `내 ${SEEDS[me.seed].label}나무. 출근 ${days}일, ${harvested ? '수확 완료' : g.cur.label + ' 단계'}.` });
  let side = '';
  if (harvested) {
    side += `<p>수확 카드를 운영진에게 DM으로 보내면 커피 쿠폰으로 바꿔 드려요.</p>
      <button class="m-btn m-btn--md m-btn--outlined-assistive" data-action="card-open">수확 카드 보기</button>`;
  } else if (canHarvest) {
    side += `<div class="m-secmsg m-secmsg--positive">${icon('circle-check-fill')}<div>수확할 수 있어요<span class="m-secmsg-desc">나무의 열매를 눌러 수확하세요. 커피 쿠폰으로 바꿀 수 있는 수확 카드가 나와요.</span></div></div>`;
  } else {
    side += `<p>${days === 0 ? '아직 출근한 날이 없어요.' : `지금까지 ${days}일 출근했고, 지금은 ${g.cur.label} 단계예요.`} ${over ? `${koDay(SEASON.end)}로 시즌이 끝났어요.` : NEXT_TEXT[g.next.key](g.next.from - days)}</p>`;
    if (!over && days + left < FRUIT_DAYS) side += `<p class="c-tertiary">남은 출근일을 모두 나와도 열매까지는 ${FRUIT_DAYS - days - left}일이 모자라요. 그래도 나무는 계속 자라요.</p>`;
  }
  side += trackHTML(days);
  if (!harvested && !canHarvest) side += `<p class="c-tertiary">열매는 출근 ${FRUIT_DAYS}일에 열리고, 수확하면 커피 쿠폰으로 바꿀 수 있어요.</p>`;
  return `<section class="panel p-tree" aria-labelledby="h-tree">
    <div class="panel-head"><h2 class="t-headline2" id="h-tree">내 나무</h2>${badge(SEEDS[me.seed].label, 'neutral', 'm-badge--md')}</div>
    <p class="t-heading1 tree-title">${title}</p>
    <div class="tree-body"><div class="tree-fig">${svg}</div><div class="tree-side">${side}</div></div>
  </section>`;
}

function todayAttendees(today) {
  return allMembers().map(m => ({ m, r: getRecs(m)[today] })).filter(x => x.r).sort((a, b) => (a.r.in || '').localeCompare(b.r.in || ''));
}
function campPanel(today, over) {

function toast(msg, kind = 'positive') {
  const el = document.createElement('div');

  el.innerHTML = `${icon(kind === 'positive' ? 'circle-check-fill' : 'circle-info-fill')}<span>${esc(msg)}</span>`;
  $('#toast-region').appendChild(el);
  setTimeout(() => { el.classList.add('is-out'); setTimeout(() => el.remove(), 220); }, 3200);
}
let overlayClose = null, lastFocus = null;
function openOverlay(html, kind) {
  lastFocus = document.activeElement;
  $('#toast-region').innerHTML = '';
  const root = $('#overlay-root');
  root.innerHTML = `<div class="overlay overlay--${kind}"><div class="overlay-dim" data-action="overlay-dismiss"></div>${html}</div>`;
  const box = root.querySelector('[role]');
  const focusables = () => [...box.querySelectorAll('button,input,[href]')].filter(el => !el.disabled && el.type !== 'hidden');
  const first = box.querySelector('[data-autofocus]') || focusables()[0];
  if (first) first.focus();
  const onKey = e => {
    if (e.key === 'Escape') { e.preventDefault(); overlayClose && overlayClose('cancel'); }
    if (e.key === 'Tab') {
      const f = focusables(); if (!f.length) return;
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  };
  document.addEventListener('keydown', onKey);
  return new Promise(resolve => {
    overlayClose = result => {
      document.removeEventListener('keydown', onKey);
      root.innerHTML = ''; overlayClose = null;
      if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
      resolve(result);
    };
  });
}

    const input = c.querySelector('input');

}

      if (dl) { await dl.save({ filename: ui.card.filename, data: ui.card.blob }); return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(ui.card.blob); a.download = ui.card.filename; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { if (!e || e.code !== 'declined') toast('저장하지 못했어요. 이미지를 길게 눌러 저장해 주세요.', 'info'); }
  },
  'cal-prev'() { ui.calMonth = MONTHS[Math.max(0, MONTHS.indexOf(ui.calMonth) - 1)]; render(); },
  'cal-next'() { ui.calMonth = MONTHS[Math.min(MONTHS.length - 1, MONTHS.indexOf(ui.calMonth) + 1)]; render(); },
  settings() { const me = currentUser(); if (me) settingsModal(me); },
  logout() { store.session = null; save(); go('login'); },
  'demo-login'() { store.session = 'demo'; save(); go('home'); },
  'demo-prev'() { if (store.demoDate > DEMO_MIN) { store.demoDate = addDays(store.demoDate, -1); ui.calMonth = null; save(); render(); } },
  'demo-next'() { if (store.demoDate < DEMO_MAX) { store.demoDate = addDays(store.demoDate, 1); ui.calMonth = null; save(); render(); } },
  'demo-reset'() { store = fresh(); ui.calMonth = null; save(); go('login'); toast('예시를 처음 상태로 되돌렸어요.'); },
  'overlay-cancel'() { overlayClose && overlayClose('cancel'); },
  'overlay-dismiss'() { overlayClose && overlayClose('cancel'); },
};
function focusMain() {
  const b = [$('#main-action-m'), $('#main-action')].find(el => el && !el.disabled && el.offsetParent !== null);
  if (b) b.focus({ preventScroll: true });
}

/* ================= 라우팅 · 렌더 ================= */
const TITLES = { login: '로그인', signup: '가입하기', home: '내 나무', calendar: '캘린더', garden: '모두의 과수원' };
function go(name) { if (location.hash === '#' + name) render(); else location.hash = name; }
function render() {
  const me = currentUser();
  let route = (location.hash || '').replace('#', '');
  if (!me) { if (route !== 'signup') route = 'login'; }
  else if (!['home', 'calendar', 'garden'].includes(route)) route = 'home';
  ui.route = route;
  renderDemoBar();
  renderChrome(me, route);
  $('#app').innerHTML = route === 'login' ? viewLogin() : route === 'signup' ? viewSignup()
    : route === 'home' ? viewHome(me) : route === 'calendar' ? viewCalendar(me) : viewGarden(me);
  document.title = `${TITLES[route]} | 열매 출근부`;
}
function run(t, e) { const fn = actions[t.dataset.action]; if (fn) fn(t, e); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (t && !t.disabled) run(t, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest && e.target.closest('[role="button"][data-action]');
  if (t) { e.preventDefault(); run(t, e); }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.dataset && forms[f.dataset.form]) { e.preventDefault(); forms[f.dataset.form](f); }
});
window.addEventListener('hashchange', () => { if (overlayClose) overlayClose('cancel'); render(); window.scrollTo(0, 0); });
render();
})();

</script>
</body>
</html>
