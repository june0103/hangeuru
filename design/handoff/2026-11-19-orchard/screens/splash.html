/* 과수원 온보딩(스플래시, 씨앗 고르기) 시안 화면의 스타일. 색·글자·모서리는 몽타주 4.3.2 토큰 값.

:root {

}

    --line: rgba(112, 115, 124, 0.28); --brand: #3385FF; --glass: 46%; --edge: rgba(255, 255, 255, 0.1);

  --line: rgba(112, 115, 124, 0.28); --brand: #3385FF; --glass: 46%; --edge: rgba(255, 255, 255, 0.1);
  --shadow: rgba(0, 0, 0, 0.5); --sheen: rgba(255, 255, 255, 0.07); color-scheme: dark;

* { box-sizing: border-box; }

  margin: 0;
  color: var(--fg);

}

/* 헤더: 원티드 로고(LogoWanted 112 × 32) */
.top {

}

}
.screen { margin: auto; width: 100%; }

/* 차례로 떠오르며 또렷해진다. 끝난 뒤에는 아무 속성도 남기지 않는다(backwards):
   filter 가 남으면 그 안의 유리가 뒤를 흐리지 못해 테두리와 채움만 얼룩처럼 보인다 */
.rise { animation: rise 0.9s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 90ms + 80ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); filter: blur(8px); } to { opacity: 1; transform: none; filter: blur(0); } }

/* 유리: 뒤가 흐리게 비치고 위쪽 가장자리에 빛이 맺힌다 */
.glass {
  background: color-mix(in srgb, var(--panel) var(--glass), transparent);
  -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
  border: 1px solid var(--edge);
  border-radius: 24px;
  box-shadow: inset 0 1px 0 var(--sheen), 0 28px 64px -36px var(--shadow), 0 2px 8px -5px var(--shadow);
  padding: 32px;
}

/* 몽타주 Button(solid, primary, large). 누르면 살짝 눌린다 */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 0.25em;
  height: 48px; padding: 0 28px; border: 0; border-radius: 12px;
  background: var(--brand); color: var(--on-brand); text-decoration: none;
  font-weight: 600; font-size: 16px; line-height: 24px; letter-spacing: 0.0057em;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
  transition: transform 0.5s var(--ease);
}
.btn::after { content: ""; position: absolute; inset: 0; background: #171719; opacity: 0; transition: opacity 0.3s var(--ease); }
.btn:hover::after { opacity: 0.08; }
.btn:active { transform: scale(0.98); }
.btn:active::after { opacity: 0.16; }
.textbtn { background: none; border: 0; padding: 8px 6px; min-height: 44px; color: var(--fg2); font-weight: 500; font-size: 14px; line-height: 20px; }
.textbtn:hover { color: var(--fg); }
/* 제목 위의 작은 영문 표지. 칩(알약 모양 바탕)은 쓰지 않고 글자만 둔다.
   세 글줄의 위계: 표지(14px, 중간 굵기) → 12px → 제목(굵게, 행간 1.3) → 12~16px → 보조 문장(보통 굵기, 행간 1.6) */

.journey .top { position: fixed; left: 0; right: 0; top: 0; z-index: 2; }

}

/* ---------- 씨앗 고르기: 캐릭터를 고르듯 과일 하나가 주인공 ----------

.select .screen { max-width: 640px; }

.fruit3d.big { width: min(84vw, 400px); max-height: 46vh; max-height: 46dvh; cursor: grab; -webkit-mask-image: linear-gradient(to right, transparent, #000 9%, #000 91%, transparent); mask-image: linear-gradient(to right, transparent, #000 9%, #000 91%, transparent); }
.fruit3d.big:active { cursor: grabbing; }
.arrow {

.arrow:active { transform: scale(0.9); }
.arrow svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.meta h2 { font-weight: 700; font-size: clamp(36px, 10vw, 52px); line-height: 1.24; letter-spacing: -0.03em; }

  .pin { grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }

  .cap .btn { display: none; }
  .startglass {

    display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px 0 16px; border-radius: 9999px;
    background: color-mix(in srgb, var(--panel) 44%, transparent);
    -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
    box-shadow: inset 0 0 0 1px var(--edge), inset 0 1px 0 var(--sheen), 0 10px 28px -14px rgba(23, 23, 25, 0.28);
    color: var(--fg2); font-weight: 500; font-size: 13px; line-height: 18px; text-decoration: none; white-space: nowrap;   /* 글자와 아이콘은 넓은 화면의 아래로 버튼과 같다 */
    transition: transform 0.3s var(--ease), background-color 0.3s var(--ease);

  .startglass:active { transform: translateX(-50%) scale(0.97); background: color-mix(in srgb, var(--panel) 60%, transparent); }
  .startglass svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; animation: nudge-x 1.8s var(--ease) infinite; }
  @media (max-height: 700px) { .startglass { bottom: 24px; } }
  .pin { cursor: pointer; -webkit-tap-highlight-color: transparent; }
}
@media (min-width: 900px) {
  /* 넓은 화면의 스플래시: 글은 왼쪽, 장면은 오른쪽 */

<script>
(function () {
  var view = null, caps = [].slice.call(document.querySelectorAll('.cap')), dots = [].slice.call(document.querySelectorAll('.dots li'));
  var next = document.getElementById('next'), N = caps.length;
  function progress() { var max = document.documentElement.scrollHeight - window.innerHeight; return max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0; }
  function paint() {
    var p = progress(), at = p * (N - 1);
    if (view) view.set(p);
    caps.forEach(function (c, i) {
      var d = at - i, o = Math.max(0, 1 - Math.abs(d) * 1.9);

      c.style.visibility = o < 0.02 ? 'hidden' : 'visible'; c.style.pointerEvents = o > 0.6 ? 'auto' : 'none';
    });
    dots.forEach(function (d, i) { d.className = Math.round(at) === i ? 'on' : ''; });
    next.style.opacity = at > N - 1.4 ? 0 : 1; next.style.pointerEvents = at > N - 1.4 ? 'none' : 'auto';
  }
  window.addEventListener('scroll', paint, { passive: true });
  window.addEventListener('resize', paint);
  function advance() {
    if (window.__still) return;
    var max = document.documentElement.scrollHeight - window.innerHeight, at = progress() * (N - 1);
    if (at > N - 1.05) return;   // 마지막 장면에서는 넘어갈 곳이 없다(시작하기 버튼으로 간다)
    window.scrollTo({ top: max * Math.min(N - 1, Math.floor(at + 0.05) + 1) / (N - 1), behavior: 'smooth' });
  }
  next.addEventListener('click', function (e) { e.stopPropagation(); advance(); });
  // 좁은 화면(모바일)에서는 아래로 버튼과 점 표시가 없고, 화면 아무 곳이나 누르면 다음 장면으로 넘어간다

    if (window.innerWidth > 767 || e.target.closest('a, button')) return;
    advance();
  });
